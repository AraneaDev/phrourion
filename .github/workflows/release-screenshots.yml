name: Refresh release screenshots

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  refresh:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release-please--branches--main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install screenshot tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y librsvg2-bin imagemagick
      - name: Generate release screenshots
        run: |
          scripts/screenshot.sh "" docs/screenshots/dashboard.gif dashboard
          scripts/screenshot.sh "" docs/screenshots/help-modal.gif help
      - name: Commit changed screenshots
        run: |
          if git diff --quiet -- docs/screenshots/dashboard.gif docs/screenshots/help-modal.gif; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/dashboard.gif docs/screenshots/help-modal.gif
          git commit -m "chore: refresh screenshots for release version"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
