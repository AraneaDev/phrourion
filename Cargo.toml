[package]
name = "phrourion"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "A terminal watch post for local repositories, remote branches, checks, and releases"
license = "MIT"
repository = "https://github.com/AraneaDev/phrourion"
keywords = ["git", "tui", "github", "repositories", "monitor"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "phrourion"
path = "src/bin/phrourion.rs"

[[bin]]
name = "phro"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
fs2 = "0.4"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
url = "2"

[profile.release]
lto = "thin"
strip = true
